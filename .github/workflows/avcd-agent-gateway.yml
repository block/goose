name: avcd-agent-gateway

on:
  push:
    paths:
      - 'services/avcd-agent-gateway/**'
      - '.github/workflows/avcd-agent-gateway.yml'
  pull_request:
    paths:
      - 'services/avcd-agent-gateway/**'
      - '.github/workflows/avcd-agent-gateway.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/avcd-agent-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/avcd-agent-gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e
