# Unsigned DEV desktop publish — overwrites GitHub Release tag `dev`.
# Does not use the signing environment. Do not copy canary.yml's aaif-goose guard.
name: Publish Avocado Work desktop (dev, unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ui/desktop/**"
      - "crates/**"
      - ".github/workflows/publish-desktop-dev.yml"
      - ".github/workflows/bundle-macos.yml"
      - ".github/workflows/bundle-windows.yml"

permissions:
  contents: read

concurrency:
  group: publish-desktop-dev
  cancel-in-progress: true

jobs:
  bundle-macos-arm64:
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      target: aarch64-apple-darwin
      package_cli: false
      package_desktop: true
      signing: false
    secrets: inherit

  bundle-macos-x64:
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      target: x86_64-apple-darwin
      package_cli: false
      package_desktop: true
      signing: false
    secrets: inherit

  bundle-windows:
    uses: ./.github/workflows/bundle-windows.yml
    permissions:
      id-token: write
      contents: read
    with:
      package_cli: false
      package_desktop: true
      signing: false
    secrets: inherit

  release:
    name: Release dev
    runs-on: ubuntu-latest
    needs: [bundle-macos-arm64, bundle-macos-x64, bundle-windows]
    permissions:
      contents: write
    env:
      GITHUB_OWNER: Avocado-Technology
      GITHUB_REPO: avcd-agent
      GOOSE_BUNDLE_NAME: Avocado Work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '!internal-*'
          merge-multiple: true

      - name: Publish GitHub Release tag dev
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: dev
          name: Dev
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          allowUpdates: true
          omitBody: true
          replacesArtifacts: true
          artifacts: |
            Avocado Work.dmg
            Avocado Work_intel_mac.dmg
            Avocado Work-Setup-x64.exe
            Avocado Work*.zip
