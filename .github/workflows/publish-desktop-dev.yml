# Unsigned DEV desktop publish — overwrites GitHub Release tag `dev`.
# Follows upstream canary.yml: reusable bundle-macos.yml / bundle-windows.yml,
# goose-cli built once per target, unsigned, then ncipollo release-action.
# Differences from canary (intentional for DEV speed): no Linux/CUDA/CLI archives.
# Does not use the signing environment. Do not copy canary.yml's aaif-goose guard.
name: Publish Avocado Work desktop (dev, unsigned)

on:
  workflow_dispatch:
    inputs:
      include_intel_mac:
        description: 'Build Intel Mac DMG (macos-15-intel; usually the slowest job). Official canary always builds this.'
        type: boolean
        default: true
      include_windows:
        description: 'Build Windows installer'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "ui/desktop/**"
      - "crates/**"
      - ".github/workflows/publish-desktop-dev.yml"
      - ".github/workflows/bundle-macos.yml"
      - ".github/workflows/bundle-windows.yml"

permissions:
  contents: read

concurrency:
  group: publish-desktop-dev
  cancel-in-progress: true

jobs:
  bundle-macos-arm64:
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      target: aarch64-apple-darwin
      package_cli: false
      package_desktop: true
      signing: false
    secrets: inherit

  bundle-macos-x64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_intel_mac }}
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      target: x86_64-apple-darwin
      package_cli: false
      package_desktop: true
      signing: false
    secrets: inherit

  bundle-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_windows }}
    uses: ./.github/workflows/bundle-windows.yml
    permissions:
      id-token: write
      contents: read
    with:
      package_cli: false
      package_desktop: true
      signing: false
    secrets: inherit

  release:
    name: Release dev
    runs-on: ubuntu-latest
    needs: [bundle-macos-arm64, bundle-macos-x64, bundle-windows]
    if: >
      always() &&
      !cancelled() &&
      needs.bundle-macos-arm64.result == 'success' &&
      (needs.bundle-macos-x64.result == 'success' || needs.bundle-macos-x64.result == 'skipped') &&
      (needs.bundle-windows.result == 'success' || needs.bundle-windows.result == 'skipped')
    permissions:
      contents: write
    env:
      GITHUB_OWNER: Avocado-Technology
      GITHUB_REPO: avcd-agent
      GOOSE_BUNDLE_NAME: Avocado Work
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: '!internal-*'
          merge-multiple: true

      # GitHub stores assets with spaces replaced by periods (Avocado.Work.dmg).
      # ncipollo/replacesArtifacts matches the local filename, so stale period-named
      # assets block uploads of the freshly built space-named files.
      - name: Clear existing dev release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for id in $(gh release view dev --repo "${GITHUB_OWNER}/${GITHUB_REPO}" --json assets -q '.assets[].id'); do
            gh api -X DELETE "repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases/assets/${id}" || true
          done

      - name: Publish GitHub Release tag dev
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd  # v1.21.0
        with:
          tag: dev
          name: Dev
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          allowUpdates: true
          omitBody: true
          replacesArtifacts: true
          artifacts: |
            *.dmg
            *.exe
            *.zip
