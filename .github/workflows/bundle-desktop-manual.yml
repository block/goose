name: Manual Desktop Bundle

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to bundle app from'
        required: true
        type: string
      signing:
        description: 'Whether to run signed/notarized rehearsal'
        required: false
        default: false
        type: boolean
      environment:
        description: 'GitHub Environment containing Apple signing secrets'
        required: false
        default: ''
        type: string

jobs:
  bundle-desktop:
    uses: ./.github/workflows/bundle-desktop.yml
    permissions:
      id-token: write
      contents: read
    with:
      signing: ${{ inputs.signing }}
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.branch }}

  bundle-desktop-intel:
    uses: ./.github/workflows/bundle-desktop-intel.yml
    permissions:
      id-token: write
      contents: read
    with:
      signing: ${{ inputs.signing }}
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.branch }}
