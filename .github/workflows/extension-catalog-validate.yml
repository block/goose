name: Validate Extension Catalog

# Structural validation of the extension catalog (documentation/static/servers.json).
# Read-only and dependency-free, so it runs safely on fork PRs without secrets.
on:
  pull_request:
    paths:
      - 'documentation/static/servers.json'
      - 'documentation/static/servers.schema.json'
      - 'documentation/scripts/validate-servers.js'
      - 'documentation/scripts/validate-servers.test.js'
  push:
    branches:
      - main
    paths:
      - 'documentation/static/servers.json'
      - 'documentation/static/servers.schema.json'
      - 'documentation/scripts/validate-servers.js'
      - 'documentation/scripts/validate-servers.test.js'

permissions:
  contents: read

concurrency:
  group: validate-catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20

      - name: Validate servers.json
        working-directory: ./documentation
        run: node scripts/validate-servers.js

      - name: Run validator unit tests
        working-directory: ./documentation
        run: node --test scripts/validate-servers.test.js
