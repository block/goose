name: "Bundle CLI and Desktop (Windows)"

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'Whether to sign the Windows executable'
        required: false
        type: boolean
        default: false
      package_cli:
        description: 'Whether to package and upload the CLI artifact'
        required: false
        type: boolean
        default: false
      package_desktop:
        description: 'Whether to package and upload the Desktop artifact'
        required: false
        type: boolean
        default: false
      windows_variant:
        description: 'Windows artifact variant: standard or cuda'
        required: false
        type: choice
        options:
          - standard
          - cuda
        default: 'standard'
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: false
        type: string
      signing:
        description: 'Whether to sign the Windows executable'
        required: false
        type: boolean
        default: false
      package_cli:
        description: 'Whether to package and upload the CLI artifact'
        required: false
        type: boolean
        default: false
      package_desktop:
        description: 'Whether to package and upload the Desktop artifact'
        required: false
        type: boolean
        default: false
      environment:
        description: 'GitHub Environment containing signing secrets. Leave empty for unsigned builds.'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      windows_variant:
        description: 'Windows artifact variant: standard or cuda'
        required: false
        type: string
        default: 'standard'

permissions:
  contents: read

jobs:
  build-goose-windows:
    name: Build Goose (Windows)
    runs-on: ${{ inputs.windows_variant == 'cuda' && 'windows-2022' || 'windows-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || '' }}

      - name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION=$(bash scripts/release-version.sh "${INPUT_VERSION:-}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved RELEASE_VERSION=${VERSION}"

      - name: Update Cargo version
        shell: bash
        run: bash scripts/set-cargo-version.sh "$RELEASE_VERSION"

      # rust-cache must run after the toolchain is selected (rust-cache README).
      - name: Setup Rust
        shell: bash
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc

      - name: Restore goose CLI binary
        id: goose-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: target/x86_64-pc-windows-msvc/release/goose.exe
          key: goose-cli-x86_64-pc-windows-msvc-${{ inputs.windows_variant }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**', '.cargo/**') }}

      - name: Cache Rust dependencies
        if: steps.goose-bin.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          shared-key: goose-cli-windows-${{ inputs.windows_variant }}
          key: windows-msvc-desktop-${{ inputs.windows_variant }}

      - name: Install CUDA toolkit
        if: ${{ inputs.windows_variant == 'cuda' && steps.goose-bin.outputs.cache-hit != 'true' }}
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d  # v0.2.36
        with:
          cuda: '12.9.1'
          method: 'local'
          log-file-suffix: 'bundle-windows-cuda.txt'

      - name: Set up MSVC developer environment
        if: ${{ inputs.windows_variant == 'cuda' && steps.goose-bin.outputs.cache-hit != 'true' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64

      - name: Verify CUDA toolchain
        if: ${{ inputs.windows_variant == 'cuda' && steps.goose-bin.outputs.cache-hit != 'true' }}
        shell: pwsh
        env:
          CUDA_COMPUTE_CAP: "80"
        run: |
          Write-Output "CUDA_PATH=$env:CUDA_PATH"
          Write-Output "CUDA_COMPUTE_CAP=$env:CUDA_COMPUTE_CAP"
          where.exe cl
          where.exe nvcc
          nvcc -V

      - name: Build Windows executable
        if: steps.goose-bin.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CUDA_COMPUTE_CAP: ${{ inputs.windows_variant == 'cuda' && '80' || '' }}
        run: |
          $isCuda = "${{ inputs.windows_variant }}" -eq "cuda"

          if ($isCuda) {
            cargo build --release --target x86_64-pc-windows-msvc -p goose-cli --bin goose --features cuda
          } else {
            cargo build --release --target x86_64-pc-windows-msvc -p goose-cli --bin goose
          }

          $binaryPath = "./target/x86_64-pc-windows-msvc/release/goose.exe"
          if (-not (Test-Path $binaryPath)) {
            Write-Error "Windows binary not found: $binaryPath"
            Get-ChildItem ./target/x86_64-pc-windows-msvc/release/ -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Item $binaryPath

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: internal-goose-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: target/x86_64-pc-windows-msvc/release/goose.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  package-cli-windows:
    name: Package CLI (Windows)
    if: ${{ inputs.package_cli }}
    needs: build-goose-windows
    runs-on: ${{ inputs.windows_variant == 'cuda' && 'windows-2022' || 'windows-latest' }}
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: internal-goose-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: package

      - name: Package CLI
        shell: bash
        env:
          VARIANT_SUFFIX: ${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
        run: |
          mkdir -p goose-package
          cp package/goose.exe goose-package/
          7z a -tzip "goose-x86_64-pc-windows-msvc${VARIANT_SUFFIX}.zip" goose-package/

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: goose-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: goose-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}.zip
          if-no-files-found: error
          overwrite: true

  build-desktop-windows:
    name: Build Desktop (Windows)
    if: ${{ inputs.package_desktop }}
    needs: build-goose-windows
    runs-on: ${{ inputs.windows_variant == 'cuda' && 'windows-2022' || 'windows-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.10.0

      - name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION=$(bash scripts/release-version.sh "${INPUT_VERSION:-}")
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved RELEASE_VERSION=${VERSION}"

      - name: Update desktop version
        shell: bash
        run: |
          cd ui/desktop
          npm pkg set "version=${RELEASE_VERSION}"

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            ui/desktop/node_modules
            .hermit/node/cache
          key: windows-pnpm-cache-v1-${{ runner.os }}-node24-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            windows-pnpm-cache-v1-${{ runner.os }}-node24-

      - name: Download binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: internal-goose-x86_64-pc-windows-msvc${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: backend

      - name: Prepare Windows binary
        shell: bash
        run: |
          rm -rf ./ui/desktop/src/bin
          mkdir -p ./ui/desktop/src/bin
          cp -f ./backend/goose.exe ./ui/desktop/src/bin/

          if [ -d "./ui/desktop/src/platform/windows/bin" ]; then
            for file in ./ui/desktop/src/platform/windows/bin/*.{exe,dll,cmd}; do
              filename="$(basename "$file")"
              if [ -f "$file" ] && [ "$filename" != "goose.exe" ]; then
                cp -f "$file" ./ui/desktop/src/bin/
              fi
            done

            if [ -d "./ui/desktop/src/platform/windows/bin/goose-npm" ]; then
              cp -r ./ui/desktop/src/platform/windows/bin/goose-npm/ ./ui/desktop/src/bin/goose-npm/
            fi
          fi

      - name: Force GitHub HTTPS for npm git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"

      - name: Resolve desktop asset names
        shell: bash
        env:
          GOOSE_BUNDLE_NAME: Avocado Work
        run: |
          cd ui/desktop
          APP_DIR=$(node scripts/release-assets.js "$RELEASE_VERSION" --field winX64.appDir)
          echo "APP_DIR=${APP_DIR}" >> "$GITHUB_ENV"

      - name: Build desktop UI with pnpm
        shell: bash
        env:
          ELECTRON_PLATFORM: win32
          GITHUB_OWNER: Avocado-Technology
          GITHUB_REPO: avcd-agent
          GOOSE_BUNDLE_NAME: Avocado Work
        run: |
          cd ui/desktop
          pnpm install --frozen-lockfile
          node scripts/build-main.js
          node scripts/prepare-platform-binaries.js
          # Package first (no installer yet) so signing can happen before Squirrel wraps the app.
          pnpm exec electron-forge package --platform=win32 --arch=x64

      - name: Prepare flat distribution
        shell: bash
        run: |
          cd ui/desktop
          mkdir -p "./out/${APP_DIR}/resources/bin"
          cp -r src/bin/* "./out/${APP_DIR}/resources/bin/"

          mkdir -p ./dist-windows
          cp -r "./out/${APP_DIR}/"* ./dist-windows/

          ls -la ./dist-windows/
          ls -la ./dist-windows/resources/bin/

      - name: Upload unsigned distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: internal-windows-unsigned${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: ui/desktop/dist-windows/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  sign-desktop-windows:
    name: Sign Desktop (Windows)
    needs: build-desktop-windows
    if: ${{ inputs.package_desktop && inputs.signing }}
    runs-on: windows-latest
    environment: ${{ inputs.environment || '' }}
    permissions:
      id-token: write
    steps:
      - name: Download unsigned distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: internal-windows-unsigned${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: dist-windows

      - name: Azure login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executables with Azure Trusted Signing
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}/dist-windows/avocado-work.exe
            ${{ github.workspace }}/dist-windows/resources/bin/goose.exe

      - name: Verify signed executables
        shell: pwsh
        run: |
          $files = @(
            "dist-windows/avocado-work.exe",
            "dist-windows/resources/bin/goose.exe"
          )
          foreach ($file in $files) {
            Write-Output "Verifying signature: $file"
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") { throw "Signature invalid for ${file}: $($sig.Status)" }
            Write-Output "Signature valid: $file"
          }

      - name: Checkout for Forge makers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: src

      - name: Build signed Squirrel installer
        shell: bash
        env:
          GITHUB_OWNER: Avocado-Technology
          GITHUB_REPO: avcd-agent
          GOOSE_BUNDLE_NAME: Avocado Work
          INPUT_VERSION: ${{ inputs.version }}
          VARIANT_SUFFIX: ${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
        run: |
          set -euo pipefail
          RELEASE_VERSION=$(bash src/scripts/release-version.sh "${INPUT_VERSION:-}")
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          cd src
          npm install -g pnpm@10.30.3
          cd ui/desktop
          pnpm install --frozen-lockfile
          APP_DIR=$(node scripts/release-assets.js "$RELEASE_VERSION" --field winX64.appDir)
          SETUP_EXE=$(node scripts/release-assets.js "$RELEASE_VERSION" --field winX64.website)
          PORTABLE_ZIP=$(node scripts/release-assets.js "$RELEASE_VERSION" --field winX64.portableZip)
          SETUP_OUT="${SETUP_EXE%.exe}${VARIANT_SUFFIX}.exe"
          ZIP_OUT="${PORTABLE_ZIP%.zip}${VARIANT_SUFFIX}.zip"
          {
            echo "SETUP_OUT=${SETUP_OUT}"
            echo "ZIP_OUT=${ZIP_OUT}"
          } >> "$GITHUB_ENV"
          rm -rf "out/${APP_DIR}"
          mkdir -p "out/${APP_DIR}"
          cp -r "${GITHUB_WORKSPACE}/dist-windows/"* "out/${APP_DIR}/"
          pnpm exec electron-forge make --platform=win32 --arch=x64 --skip-package \
            --targets=@electron-forge/maker-squirrel,@electron-forge/maker-zip
          SETUP_SRC=$(find out/make -name "$SETUP_EXE" -print -quit)
          test -n "$SETUP_SRC"
          cp "$SETUP_SRC" "${GITHUB_WORKSPACE}/${SETUP_OUT}"

      - name: Sign Squirrel Setup.exe
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}/${{ env.SETUP_OUT }}

      - name: Verify signed Setup.exe
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "${{ env.SETUP_OUT }}"
          if ($sig.Status -ne "Valid") { throw "Signature invalid for Setup.exe: $($sig.Status)" }

      - name: Create Windows zip package
        shell: bash
        run: 7z a -tzip "${ZIP_OUT}" dist-windows/

      - name: Upload signed Windows zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Avocado Work-win32-x64${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: ${{ env.ZIP_OUT }}
          if-no-files-found: error
          overwrite: true

      - name: Upload signed Windows Setup.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Avocado Work-Setup-x64${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: ${{ env.SETUP_OUT }}
          if-no-files-found: error
          overwrite: true

  package-desktop-windows:
    name: Package Desktop (Windows)
    needs: build-desktop-windows
    if: ${{ inputs.package_desktop && !inputs.signing }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download unsigned distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: internal-windows-unsigned${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: dist-windows

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Build unsigned Squirrel installer from packaged app
        shell: bash
        env:
          GITHUB_OWNER: Avocado-Technology
          GITHUB_REPO: avcd-agent
          GOOSE_BUNDLE_NAME: Avocado Work
          INPUT_VERSION: ${{ inputs.version }}
          VARIANT_SUFFIX: ${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
        run: |
          set -euo pipefail
          RELEASE_VERSION=$(bash scripts/release-version.sh "${INPUT_VERSION:-}")
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          cd ui/desktop
          pnpm install --frozen-lockfile
          APP_DIR=$(node scripts/release-assets.js "$RELEASE_VERSION" --field winX64.appDir)
          SETUP_EXE=$(node scripts/release-assets.js "$RELEASE_VERSION" --field winX64.website)
          PORTABLE_ZIP=$(node scripts/release-assets.js "$RELEASE_VERSION" --field winX64.portableZip)
          SETUP_OUT="${SETUP_EXE%.exe}${VARIANT_SUFFIX}.exe"
          ZIP_OUT="${PORTABLE_ZIP%.zip}${VARIANT_SUFFIX}.zip"
          {
            echo "SETUP_OUT=${SETUP_OUT}"
            echo "ZIP_OUT=${ZIP_OUT}"
          } >> "$GITHUB_ENV"
          rm -rf "out/${APP_DIR}"
          mkdir -p "out/${APP_DIR}"
          cp -r "${GITHUB_WORKSPACE}/dist-windows/"* "out/${APP_DIR}/"
          pnpm exec electron-forge make --platform=win32 --arch=x64 --skip-package \
            --targets=@electron-forge/maker-squirrel,@electron-forge/maker-zip
          SETUP_SRC=$(find out/make -name "$SETUP_EXE" -print -quit)
          test -n "$SETUP_SRC"
          cp "$SETUP_SRC" "${GITHUB_WORKSPACE}/${SETUP_OUT}"
          cd "${GITHUB_WORKSPACE}"
          7z a -tzip "${ZIP_OUT}" dist-windows/

      - name: Upload Windows zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Avocado Work-win32-x64${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: ${{ env.ZIP_OUT }}
          if-no-files-found: error
          overwrite: true

      - name: Upload Windows Setup.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Avocado Work-Setup-x64${{ inputs.windows_variant == 'cuda' && '-cuda' || '' }}
          path: ${{ env.SETUP_OUT }}
          if-no-files-found: error
          overwrite: true
