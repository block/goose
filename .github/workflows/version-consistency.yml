name: Version consistency

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Cargo.toml matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check version consistency
        run: bash scripts/release-version.sh --check
      - name: Self-test mismatch fails
        run: bash scripts/release-version.sh --self-test
