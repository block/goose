name: Sync upstream

on:
  schedule:
    # Hourly, off the top of the hour.
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    # Only run in the fork; scheduled runs happen on the default branch.
    if: github.repository == 'thisguycodes/goose'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write # merge upstream into main
    steps:
      - name: Merge upstream into main
        env:
          # Optional fine-grained PAT (Contents: RW on this fork). Pushes made
          # with GITHUB_TOKEN do not trigger CI on main; with SYNC_TOKEN they do.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # One call: merges the upstream default branch into this fork's main
          # (fast-forward when possible, merge commit otherwise). A no-op when
          # already up to date. Fails with 409 on merge conflicts — resolve
          # those manually once, then the hourly runs take over again.
          gh api -X POST "repos/$REPO/merge-upstream" -f branch=main \
            --jq '{message, merge_type, base_branch}'
