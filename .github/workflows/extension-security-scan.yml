name: Extension Security Scan

# Scans new/changed catalog extensions with the Cisco AI Defense MCP Scanner.
#
# SECURITY MODEL: scanning a stdio server means launching third-party code
# (npx/uvx) on the runner. This job therefore runs in the untrusted `pull_request`
# context with a read-only token and NO repository secrets, so a malicious server
# has nothing to steal and cannot write to the repo. The job's own pass/fail is
# the blocking signal (require it in branch protection). A separate
# `extension-security-scan-report.yml` workflow posts the PR comment with write
# permissions, after this run completes.
#
# Default analyzer is YARA (key-less). Do not add LLM/API analyzers here unless
# you are comfortable exposing that API key to untrusted server code.

on:
  pull_request:
    paths:
      - 'documentation/static/servers.json'
      - 'documentation/docs/mcp/**'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ext-security-scan-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

env:
  ANALYZERS: ${{ vars.EXTENSION_SCAN_ANALYZERS || 'yara' }}
  BLOCK_SEVERITY: ${{ vars.EXTENSION_SCAN_BLOCK_SEVERITY || 'HIGH' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 0

      - name: Determine changed catalog entries
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          set -e
          CATALOG=documentation/static/servers.json
          if [ -n "$BASE_SHA" ]; then
            git show "$BASE_SHA:$CATALOG" > "$RUNNER_TEMP/base.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/base.json"
          elif [ -n "$BASE_REF" ]; then
            BASE_BRANCH="${BASE_REF#refs/heads/}"
            git fetch --no-tags --depth=1 origin "$BASE_BRANCH"
            git show "origin/$BASE_BRANCH:$CATALOG" > "$RUNNER_TEMP/base.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/base.json"
          else
            echo '[]' > "$RUNNER_TEMP/base.json"
          fi
          python3 - "$RUNNER_TEMP/base.json" "$CATALOG" "$RUNNER_TEMP/changed_ids.txt" <<'PY'
          import json, sys
          base_path, head_path, out_path = sys.argv[1], sys.argv[2], sys.argv[3]
          def load_base(p):
              try:
                  with open(p) as fh:
                      return json.load(fh)
              except Exception:
                  return []

          def load_head(p):
              try:
                  with open(p) as fh:
                      data = json.load(fh)
              except Exception as exc:
                  print(f"failed to read PR catalog: {exc}", file=sys.stderr)
                  sys.exit(1)
              if not isinstance(data, list):
                  print("PR catalog must be a JSON array", file=sys.stderr)
                  sys.exit(1)
              return data

          base = {e.get("id"): json.dumps(e, sort_keys=True) for e in load_base(base_path) if isinstance(e, dict)}
          changed = []
          for e in load_head(head_path):
              if not isinstance(e, dict) or e.get("is_builtin") is True:
                  continue
              eid = e.get("id")
              if not eid:
                  continue
              if base.get(eid) != json.dumps(e, sort_keys=True):
                  changed.append(eid)
          with open(out_path, "w") as fh:
              fh.write("\n".join(changed))
          print(f"changed={len(changed)}")
          PY
          if [ -s "$RUNNER_TEMP/changed_ids.txt" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed entries:"; cat "$RUNNER_TEMP/changed_ids.txt"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new/changed catalog entries to scan."
          fi

      - name: Set up uv
        if: steps.changed.outputs.has_changes == 'true'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Install MCP scanner
        if: steps.changed.outputs.has_changes == 'true'
        run: uv tool install --python 3.13 cisco-ai-mcp-scanner

      - name: Checkout trusted scanner harness
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_ref || github.sha }}
          path: trusted-goose
          sparse-checkout: extension-scanner
          sparse-checkout-cone-mode: true

      - name: Scan changed extensions
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash trusted-goose/extension-scanner/scan-extensions.sh \
            documentation/static/servers.json \
            "$RUNNER_TEMP/scan" \
            "$RUNNER_TEMP/changed_ids.txt"

      - name: Save PR metadata for reporter
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          echo "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/scan/pr_number.txt"

      - name: Upload scan results
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: extension-scan-results
          path: ${{ runner.temp }}/scan/**
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce verdict
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          SUMMARY="$RUNNER_TEMP/scan/summary.json"
          if [ ! -f "$SUMMARY" ]; then
            echo "::error::No scan summary produced; failing closed."
            exit 1
          fi
          STATUS=$(jq -r .overall_status "$SUMMARY")
          echo "Overall status: $STATUS"
          if [ "$STATUS" = "BLOCKED" ]; then
            echo "::error::One or more extensions have a ${BLOCK_SEVERITY}+ security finding or could not be scanned."
            jq -r '.results[] | select(.status=="scanned" and (.severity=="HIGH" or .severity=="CRITICAL" or .severity=="MEDIUM")) | "  - \(.id): \(.severity)"' "$SUMMARY" || true
            jq -r '.results[] | select(.status=="error" or .status=="timeout") | "  - \(.id): \(.status) \(.detail // "")"' "$SUMMARY" || true
            exit 1
          fi
          echo "::notice::Extension security scan passed ($STATUS)."
