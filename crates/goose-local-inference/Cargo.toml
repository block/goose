[package]
name = "goose-local-inference"
version = "0.1.0-alpha.6"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lints]
workspace = true

[features]
default = ["llamacpp"]
llamacpp = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
eredu = ["dep:eredu", "dep:eredu-core"]
cuda = ["llamacpp", "llama-cpp-2/cuda"]
vulkan = ["llamacpp", "llama-cpp-2/vulkan"]

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
etcetera = { workspace = true }
encoding_rs = { version = "0.8.35", default-features = false }
fs2 = { workspace = true }
futures = { workspace = true }
goose-download-manager = { version = "0.1.0-alpha.6", path = "../goose-download-manager" }
goose-provider-types = { version = "0.1.0-alpha.6", path = "../goose-provider-types", default-features = false }
goose-sdk-types = { version = "0.1.0-alpha.6", path = "../goose-sdk-types", default-features = false }
hf-hub = { version = "1.0.0-rc.1", default-features = false }
include_dir = { workspace = true }
llama-cpp-2 = { workspace = true, optional = true }
llama-cpp-sys-2 = { workspace = true, optional = true }
minijinja = { version = "2.18", default-features = false, features = ["loader", "multi_template", "serde"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { workspace = true, features = ["json", "stream"] }
regex = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "std"] }
tempfile = { workspace = true }
eredu = { version = "0.1.0", default-features = false, features = ["mlx"], optional = true }
eredu-core = { version = "0.1.0", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, features = ["sampler", "metal", "mtmd"], optional = true }
eredu = { version = "0.1.0", default-features = false, features = ["metal"], optional = true }

[dev-dependencies]
env-lock.workspace = true
