# MCP conformance baseline: known-failing client scenarios.
#
# Spec version:        2025-11-25
# Conformance version: 0.2.0-alpha.10
#
# Scenarios listed here are allowed to fail (or emit warnings) without failing
# CI. The conformance runner will error if any of these scenarios start passing
# (stale entry) or if a scenario not listed here fails (unexpected failure), so
# keep this list in sync as behavior changes.
client:
  # Goose registers a conventional dynamically assigned client ID instead of
  # using a URL-based Client ID Metadata Document. This is a SHOULD warning.
  - auth/basic-cimd

  # Goose only initiates OAuth when initialization fails. The challenge in this
  # scenario arrives after initialization, so no scope-upgrade flow is started.
  - auth/scope-step-up

  # Like scope-step-up, post-initialization 401 responses do not initiate OAuth;
  # consequently the runner observes no authorization attempts or retry limit.
  - auth/scope-retry-limit
