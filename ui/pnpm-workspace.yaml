packages:
  - 'sdk'
  - 'text'
  - 'desktop'
  - 'goose-binary/*'

registry: https://registry.npmjs.org/
preferOffline: true
nodeLinker: hoisted
supportedArchitectures:
  os: [current, linux, darwin, win32]
  cpu: [current, x64, arm64]
overrides:
  react: ^19.2.4
  react-dom: ^19.2.4
  '@xmldom/xmldom': ^0.8.13
  defu: ^6.1.5
  fast-uri: ^3.1.2
  flatted: ^3.4.2
  hono: ^4.12.25
  lodash: ^4.18.0
  path-to-regexp: ^8.4.0
  picomatch: ^4.0.4
  micromatch>picomatch: ^2.3.2
  react-router: ^7.15.0
  shell-quote: ^1.8.4
  tar: ^7.5.16
  tmp: ^0.2.6
  undici: ^7.28.0
  vite: ^7.3.5
  ws: ^8.21.0
allowBuilds:
  '@modelcontextprotocol/ext-apps': true
  electron: true
  electron-winstaller: true
  esbuild: true
# Electron Forge resolves @electron/node-gyp from git.
blockExoticSubdeps: false
